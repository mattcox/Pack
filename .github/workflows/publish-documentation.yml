# Workflow name.
name: Publish Documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      # Must be set to this for deploying to GitHub Pages
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pack requires a Swift 6 toolchain, which is not available on older
    # runner images.
    runs-on: macos-15
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Publish Documentation
        run: |
          xcodebuild docbuild -scheme Pack \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=iOS';
          $(xcrun --find docc) process-archive \
            transform-for-static-hosting /tmp/docbuild/Build/Products/Debug-iphoneos/Pack.doccarchive \
            --hosting-base-path Pack \
            --output-path docs;
          echo "<script>window.location.href += \"/documentation/pack\"</script>" > docs/index.html;
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only docs directory
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
